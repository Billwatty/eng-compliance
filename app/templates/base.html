<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Verify Before Certify{% endblock %}</title>
<style>
:root{--bg:#f4f6f4;--surface:#fff;--ink:#1b2220;--muted:#5a6661;--line:#cfd6d2;--laterite:#b04a22;--laterite-tint:#f6e3da;--steel:#2c5c88;--ok:#2e7d4f;--ok-tint:#e2f1e8;--amber:#9a6a12;--amber-tint:#f7ecd5;
--body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme: dark){:root{--bg:#121614;--surface:#1a201d;--ink:#e3e9e5;--muted:#9aa6a0;--line:#323b37;--laterite:#e47b4f;--laterite-tint:#3a2219;--steel:#7aaedc;--ok:#6cc08f;--ok-tint:#1b3325;--amber:#d9a54a;--amber-tint:#3a2e16;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
header.top{background:var(--surface);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-left));display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center}
header.top .brand{font-weight:700;letter-spacing:.01em}
header.top .brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
nav{display:flex;flex-wrap:wrap;gap:4px 14px}
nav a{color:var(--ink);text-decoration:none;font-size:14px;padding:2px 0;border-bottom:2px solid transparent}
nav a:hover{border-color:var(--laterite)}
form.session{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:13px}
main{max-width:1240px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-left)) 64px;display:flex;flex-direction:column;gap:24px}
h1{font-size:26px;margin:0}h2{font-size:19px;margin:0 0 8px}h3{font-size:16px;margin:0 0 6px}
p{margin:0}.muted{color:var(--muted)}.mono{font-family:var(--mono);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:7px 9px;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);white-space:nowrap;font-family:var(--mono)}
.pill.pass,.pill.approved,.pill.complete,.pill.certified,.pill.confirmed,.pill.passed,.pill.closed,.pill.reviewed{background:var(--ok-tint);border-color:var(--ok);color:var(--ok)}
.pill.fail,.pill.failed,.pill.exception,.pill.open-ncr,.pill.rejected{background:var(--laterite-tint);border-color:var(--laterite);color:var(--laterite)}
.pill.marginal,.pill.held,.pill.draft,.pill.extracted,.pill.received{background:var(--amber-tint);border-color:var(--amber);color:var(--amber)}
.flash{padding:10px 14px;border-radius:6px;background:var(--ok-tint);border:1px solid var(--ok)}
.flash.err{background:var(--laterite-tint);border-color:var(--laterite)}
form.inline{display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center}
form.stack{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:8px;align-items:end}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
input,select,textarea,button{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);min-width:0}
textarea{font-family:var(--mono);font-size:13px}
button{cursor:pointer;background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.secondary{background:var(--surface);color:var(--ink)}
button.danger{background:var(--laterite);border-color:var(--laterite);color:#fff}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.bad{color:var(--laterite);font-weight:600}
details summary{cursor:pointer;color:var(--steel)}
@media print{header.top,form,button{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Verify Before Certify<small>{{ contract.name if contract else "No contract yet" }}</small></div>
  {% if contract %}
  <nav aria-label="Main">
    <a href="/">Overview</a><a href="/rules">BOQ &amp; rules</a><a href="/standards">Standards</a><a href="/lots">Lots</a>
    <a href="/ncrs">NCRs</a><a href="/documents">Documents</a><a href="/materials">Materials</a><a href="/ipcs">IPCs</a>
    <a href="/reports/monthly">Monthly report</a><a href="/ledger">Ledger</a>
  </nav>
  {% endif %}
  <form class="session" method="post" action="/session">
    <input type="hidden" name="next" value="{{ request.url.path }}">
    <input id="who-name" name="name" value="{{ actor }}" size="14" aria-label="Your name">
    <select id="who-role" name="role" aria-label="Your role">
      {% for k, v in roles.items() %}<option value="{{ k }}" {% if k == role %}selected{% endif %}>{{ v }}</option>{% endfor %}
    </select>
    <button class="secondary" type="submit">Switch</button>
  </form>
</header>
<main>
  {% if msg %}<div class="flash {% if err %}err{% endif %}" role="status">{{ msg }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
